name: 시트 배포

# main 에 .gs 가 바뀌어 올라오면 구글시트(Apps Script)도 같이 올린다 — 앱이 Vercel 로
# 자동 배포되는 것과 짝을 맞춘다. 예전에는 사람이 편집기에 붙여넣고 [배포 관리] →
# 새 버전을 눌러야 해서, 앱만 새 버전인 채로 며칠씩 지나곤 했다.
#
# 하는 일은 로컬 `npm run deploy:gs` 와 똑같다 (scripts/deploy-gs.mjs):
#   검사 → 원격 받기 → 코드 파일 하나만 교체 → 기존 배포에 새 버전 → 운영 확인 → 실패면 되돌림
#
# ★ 이 저장소의 Secret·Variables 는 **우리 길드 시트 하나**만 가리킨다.
#   같은 저장소를 보는 다른 길드의 앱은 코드만 따라가고, 그쪽 시트는 여기서 건드리지 않는다.
on:
  push:
    branches: [main]
    paths: ['apps-script/**']
  # 처음 설정했을 때·실패 뒤 다시 돌릴 때 (Actions 탭 → 시트 배포 → Run workflow)
  workflow_dispatch:

# 두 번 연달아 push 해도 배포는 한 줄로 선다 — 동시에 두 버전을 올리면 무엇이 운영에 남을지 모른다
concurrency:
  group: deploy-gs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # 저장소를 복제한 곳에서는 돌지 않는다 (그쪽에는 우리 시트 로그인 정보가 없다)
    if: github.repository == 'rhrjsgks-jarvis/guild' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: clasp 로그인 정보 넣기
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Secret CLASPRC_JSON 이 없습니다. 로컬에서: gh secret set CLASPRC_JSON < ~/.clasprc.json"
            exit 1
          fi
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: 시트 배포 (검사 → 올리기 → 새 버전 → 운영 확인)
        run: npm run deploy:gs
        env:
          GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
          GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
          APP_URL: ${{ vars.APP_URL }}

      - name: 로그인 정보 지우기
        if: always()
        run: rm -f "$HOME/.clasprc.json"
