<meta charset="utf-8" />
<title>버튼</title>
<link rel="stylesheet" href="../_base.css" />
<link rel="stylesheet" href="../app.css" />

<div class="ds-label">기본 — 누르면 무언가가 일어나는 것</div>
<div class="ds-row">
  <button class="btn">등록</button>
  <button class="btn warn">분배</button>
  <button class="btn ghost">취소</button>
  <button class="btn danger">삭제</button>
  <button class="btn" disabled>처리 중…</button>
</div>

<div class="ds-label">가로로 꽉 — 화면의 주된 행동 하나</div>
<div class="ds-row">
  <button class="btn block">＋ 혈맹원 추가</button>
</div>
<div class="ds-row">
  <button class="btn ghost block">🗂️ 서버 일괄 지정</button>
</div>

<div class="ds-note">
  <b>각진 금테 명패.</b> 모서리 4px, 위아래로 아주 옅은 명암 — 게임 버튼은 평평하지 않습니다.<br />
  <b>색은 청록 하나입니다.</b> 금색 버튼으로 바꾸면 주황(분배 전)과 섞여 받을 돈이 묻힙니다.<br />
  <b>danger 는 채우지 않습니다.</b> 되돌릴 수 없는 것이 화면에서 제일 눈에 띄면 그것부터 누르게 됩니다.
</div>
